<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طارق ♥ شكراً لحضوركم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a07;--fg:#f6ead2;--gold:#e8c068;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0d0a07;--fg:#f6ead2;--gold:#e8c068}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 40%,#2a1d0f,var(--bg) 70%);color:var(--fg);font-family:'Cairo',Tahoma,sans-serif;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.bar{position:fixed;z-index:10;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;font-size:15px;color:#2a1a05;background:linear-gradient(135deg,#f6dc94,#c8962f);border:0;border-radius:999px;padding:11px 20px;box-shadow:0 4px 18px rgba(232,192,104,.35)}
#hint{pointer-events:none;z-index:10;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:13px;opacity:.8}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<div id="hint">اسحب بصباعك عشان تلف المجسم</div>
<div class="bar"><button id="ar" style="display:none">📍 ثبّت المجسم على الترابيزة (AR)</button><button id="cb">📷 شغّل الكاميرا</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var BRIDE='العروسة';
var T=THREE,scene=new T.Scene(),cam=new T.PerspectiveCamera(45,innerWidth/innerHeight,.01,100);
cam.position.set(0,.8,7.2);
var R=new T.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.15;R.xr.enabled=true;
document.body.appendChild(R.domElement);
/* بيئة انعكاسات */
var ec=document.createElement('canvas');ec.width=512;ec.height=256;var x=ec.getContext('2d');
var gr=x.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#1a1208');gr.addColorStop(.5,'#8a6a35');gr.addColorStop(1,'#120c05');
x.fillStyle=gr;x.fillRect(0,0,512,256);x.fillStyle='#fff';
[[40,40,90,50],[220,30,120,40],[400,60,80,60],[120,150,70,30],[330,140,100,28]].forEach(function(b){x.fillRect(b[0],b[1],b[2],b[3])});
var pm=new T.PMREMGenerator(R);scene.environment=pm.fromEquirectangular(new T.CanvasTexture(ec)).texture;
scene.add(new T.DirectionalLight(0xffffff,.8));
/* الخواتم */
var root=new T.Group();scene.add(root);
var gold=new T.MeshStandardMaterial({color:0xe3b04b,metalness:1,roughness:.12,envMapIntensity:1.6});
var rings=new T.Group();
var a=new T.Mesh(new T.TorusGeometry(1,.14,48,128),gold);a.position.x=-.5;
var b=new T.Mesh(new T.TorusGeometry(1,.14,48,128),gold);b.position.x=.5;b.rotation.x=Math.PI/2;
var pr=[];for(var i=0;i<=6;i++){var t=i/6;pr.push(new T.Vector2([.001,.26,.34,.2,.1,.05,.001][i],[.3,.3,.18,.05,-.05,-.2,-.3][i]))}
var dia=new T.Mesh(new T.LatheGeometry([new T.Vector2(.001,.22),new T.Vector2(.2,.22),new T.Vector2(.32,.08),new T.Vector2(.001,-.3)],8),
 new T.MeshPhysicalMaterial({color:0xffffff,metalness:.05,roughness:0,envMapIntensity:3.5,clearcoat:1,flatShading:true}));
dia.position.set(-.5,1.2,0);
rings.add(a,b,dia);rings.rotation.set(.45,0,.2);root.add(rings);
/* هالة تحت المجسم */
var gc=document.createElement('canvas');gc.width=gc.height=256;var gx=gc.getContext('2d');
var rg=gx.createRadialGradient(128,128,0,128,128,128);rg.addColorStop(0,'rgba(255,210,110,.9)');rg.addColorStop(.4,'rgba(255,190,80,.25)');rg.addColorStop(1,'rgba(255,190,80,0)');
gx.fillStyle=rg;gx.fillRect(0,0,256,256);
var glow=new T.Mesh(new T.PlaneGeometry(4.5,4.5),new T.MeshBasicMaterial({map:new T.CanvasTexture(gc),transparent:true,blending:T.AdditiveBlending,depthWrite:false}));
glow.rotation.x=-Math.PI/2;glow.position.y=-1.5;root.add(glow);
/* غبار دهبي */
var N=260,pa=new Float32Array(N*3);
for(i=0;i<N;i++){var r=2+Math.random()*1.6,th=Math.random()*6.283,ph=Math.acos(2*Math.random()-1);
 pa[i*3]=r*Math.sin(ph)*Math.cos(th);pa[i*3+1]=r*Math.cos(ph)*.8;pa[i*3+2]=r*Math.sin(ph)*Math.sin(th)}
var pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pa,3));
var dust=new T.Points(pg,new T.PointsMaterial({color:0xffd27a,size:.05,transparent:true,opacity:.85,blending:T.AdditiveBlending,depthWrite:false}));
root.add(dust);
/* الرسالة ثلاثية الأبعاد */
var tc=document.createElement('canvas');tc.width=1024;tc.height=640;var tx=tc.getContext('2d');
var tt=new T.CanvasTexture(tc);
function draw(){tx.clearRect(0,0,1024,640);tx.direction='rtl';tx.textAlign='center';
 var g=tx.createLinearGradient(0,0,0,640);g.addColorStop(0,'#fff0c2');g.addColorStop(.5,'#e8c068');g.addColorStop(1,'#b8862b');
 tx.fillStyle=g;tx.shadowColor='rgba(255,200,90,.6)';tx.shadowBlur=18;
 tx.font='700 120px Amiri,serif';tx.fillText('شكراً لحضوركم',512,150);
 tx.font='700 62px Amiri,serif';tx.fillText('طارق  ♥  '+BRIDE,512,290);
 tx.shadowBlur=8;tx.fillStyle='#f6ead2';tx.font='600 40px Cairo,Tahoma,sans-serif';
 tx.fillText('وجودكم أجمل هدية في يوم عمرنا',512,430);tx.fillText('ربنا يسعدكم ويفرّح قلوبكم دايماً',512,500);
 tt.needsUpdate=true}
draw();Promise.all([document.fonts.load('700 60px Amiri'),document.fonts.load('600 40px Cairo')]).then(draw).catch(draw);
var txt=new T.Mesh(new T.PlaneGeometry(4.4,2.75),new T.MeshBasicMaterial({map:tt,transparent:true,depthWrite:false}));
txt.position.y=3;root.add(txt);
/* تحكم باللمس */
var drag=false,px=0;
R.domElement.addEventListener('pointerdown',function(e){drag=true;px=e.clientX});
addEventListener('pointerup',function(){drag=false});
addEventListener('pointermove',function(e){if(drag){rings.rotation.y+=(e.clientX-px)*.012;px=e.clientX}});
addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
/* AR */
var hts=null,ret=new T.Mesh(new T.RingGeometry(.07,.09,32).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:0xffd27a}));
ret.matrixAutoUpdate=false;ret.visible=false;scene.add(ret);var placed=false,sess=null;
var v1=new T.Vector3(),v2=new T.Vector3(),clock=new T.Clock();
R.setAnimationLoop(function(t,frame){
 var e=clock.getElapsedTime();
 if(!drag)rings.rotation.y+=.012;
 rings.position.y=Math.sin(e*1.4)*.08;dust.rotation.y=e*.08;
 dia.rotation.y=e;
 glow.material.opacity=.8+Math.sin(e*2)*.2;
 var cp=v1.setFromMatrixPosition((R.xr.isPresenting?R.xr.getCamera(cam):cam).matrixWorld);
 txt.getWorldPosition(v2);cp.y=v2.y;txt.lookAt(cp);
 if(frame&&hts&&!placed){var h=frame.getHitTestResults(hts);
  if(h.length){var p=h[0].getPose(R.xr.getReferenceSpace());ret.visible=true;ret.matrix.fromArray(p.transform.matrix)}else ret.visible=false}
 R.render(scene,cam)});
if(navigator.xr&&navigator.xr.isSessionSupported){navigator.xr.isSessionSupported('immersive-ar').then(function(ok){if(ok)document.getElementById('ar').style.display=''}).catch(function(){})}
document.getElementById('ar').onclick=function(){
 navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test']}).then(function(s){
  sess=s;placed=false;root.visible=false;root.scale.setScalar(.055);
  R.xr.setReferenceSpaceType('local');R.xr.setSession(s);
  s.requestReferenceSpace('viewer').then(function(vs){s.requestHitTestSource({space:vs}).then(function(h){hts=h})});
  s.addEventListener('select',function(){if(ret.visible&&!placed){placed=true;root.position.setFromMatrixPosition(ret.matrix);root.visible=true;ret.visible=false}});
  s.addEventListener('end',function(){hts=null;root.visible=true;root.scale.setScalar(1);root.position.set(0,0,0);ret.visible=false});
 }).catch(function(){alert('الجهاز مش داعم AR، جرّب زرار الكاميرا')})};
document.getElementById('cb').onclick=function(){
 var v=document.getElementById('cam'),bt=this;
 (navigator.mediaDevices?navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}):Promise.reject({name:'Unsupported'})).then(function(s){
  v.srcObject=s;v.style.display='block';document.body.style.background='none';bt.style.display='none'
 }).catch(function(e){bt.textContent='⚠️ '+((e&&e.name)||'Error')+' — افتح الرابط في كروم أو سفاري مباشرة'})};
</script>
</body>
</html>
